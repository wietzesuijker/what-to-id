name: daily

# Rebuilds the rotation page every morning from the day's BC needs-ID pool and deploys it to
# GitHub Pages. The steps live in scripts/daily.sh so a laptop can run exactly the same build.
# The repository is public, so nothing here may print or upload the list key or anything that
# maps list letters to lists: the only files kept are the pool, the served log (letters only),
# and each day's pool and public build record, as assets on the pool-state release. out/ holds
# the manifest with the map and is never uploaded.
on:
  schedule:
    - cron: "17 13 * * *" # 06:17 in Vancouver in summer time, 05:17 in winter
  workflow_dispatch:
    inputs:
      full_pull:
        description: "Pull the whole pool (hours) instead of the records created since the last run"
        type: boolean
        default: false

permissions:
  contents: read

# Shared with pages.yml so two deploys never race.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  D1: "2025-01-01" # earliest observed_on in the pool
  STATE_TAG: pool-state
  WHAT_TO_ID_USER_AGENT: what-to-id daily build (https://github.com/PollockLab/what-to-id)

jobs:
  build:
    # The schedule stays off until the repository variable DAILY_ENABLED is "true".
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      BLITZ_D1: ${{ vars.BLITZ_D1 || '2026-11-01' }}
      FULL_PULL: ${{ inputs.full_pull }}
      WTB_DIR: wtb/cluster_results/ca
      ARMS: recency,gap_first,similarity,novelty
      EMBEDDING_RELEASE: ${{ vars.EMBEDDING_RELEASE }}
      EMBEDDING_REPO: ${{ vars.EMBEDDING_REPO || github.repository }}
      EMBEDDING_BUNDLE: data/embedding-bundle
    steps:
      # CODE_REF (a tag such as blitz-bc-2026) pins the code for the whole blitz; unset, the
      # job runs the commit that triggered it. Either way the build record names the commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.CODE_REF || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-similarity.lock
      - name: Resolve LabelFirst revision and require daily inputs
        id: labelfirst
        env:
          LABELFIRST_READ_TOKEN: ${{ secrets.LABELFIRST_READ_TOKEN }}
        run: |
          if [ -z "$LABELFIRST_READ_TOKEN" ]; then
            echo '::error::LABELFIRST_READ_TOKEN needs read-only Contents access to traitlab/labelfirst.'
            exit 1
          fi
          if [ -z "$EMBEDDING_RELEASE" ]; then
            echo '::error::Set EMBEDDING_RELEASE to a prepared embedding bundle release tag.'
            exit 1
          fi
          python - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pyproject.toml", "rb") as stream:
              config = tomllib.load(stream)
          requirement, = config["project"]["optional-dependencies"]["similarity"]
          print("revision=" + requirement.rsplit("@", 1)[1])
          PYTHON
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: traitlab/labelfirst
          ref: ${{ steps.labelfirst.outputs.revision }}
          path: .integration/labelfirst
          token: ${{ secrets.LABELFIRST_READ_TOKEN }}
          persist-credentials: false
      # The small optional lock adds only packages absent from the base lock. Installing
      # together prevents optional dependencies from silently replacing tested base pins.
      - run: pip install --require-hashes -r requirements.lock -r requirements-similarity.lock
      - run: pip install --no-deps -e .integration/labelfirst
      - run: pip check
      - name: Verify the real LabelFirst integration
        env:
          PYTHONPATH: src
        run: python -m pytest -m labelfirst tests/test_labelfirst_integration.py
      - name: Read the where-to-blitz commit the code expects
        id: wtb
        run: |
          sha=$(PYTHONPATH=src python -c "from what_to_id.manifest import WHERE_TO_BLITZ_REF as r; print(r.split('@')[1])")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: PollockLab/where-to-blitz
          ref: ${{ steps.wtb.outputs.sha }}
          path: wtb
          sparse-checkout: cluster_results/ca
      - name: Check the list key is set
        env:
          WHAT_TO_ID_KEY: ${{ secrets.WHAT_TO_ID_KEY }}
        run: |
          if [ -z "$WHAT_TO_ID_KEY" ]; then
            echo "::error::Repository secret WHAT_TO_ID_KEY is not set; run the setup wizard"
            exit 1
          fi
      # One build date for every step, even if the run crosses midnight UTC.
      - run: echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"
      - run: scripts/daily.sh fetch
      - name: Fetch and verify the versioned embedding bundle
        run: scripts/daily.sh fetch-embeddings
      - name: Build, check for leaks, replay
        env:
          WHAT_TO_ID_KEY: ${{ secrets.WHAT_TO_ID_KEY }}
        run: scripts/daily.sh build
      # Deploy before saving: the served log then never lists a build that did not go live.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out/final/site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - run: scripts/daily.sh save
      # The page is live but the state did not reach the release: keep it so the served log
      # can be restored by hand. Everything in state/ passed the leak check above.
      - if: failure() && steps.deployment.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: state-${{ github.run_id }}
          path: state/
          retention-days: 30

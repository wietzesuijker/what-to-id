name: compressed index capacity benchmark

on:
  push:
    branches: [feat/embedding-atlas]
    paths:
      - .github/workflows/embedding-index-capacity.yml
      - benchmarks/benchmark_vector_index.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedding-index-capacity
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'wietzesuijker/what-to-id'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU index dependencies
        run: |
          python -m pip install uv==0.12.23
          uv pip install --system faiss-cpu==1.15.1 numpy==2.4.6
          mkdir -p index-results index-work
          lscpu > index-results/build-cpu.txt
          uv pip freeze --system > index-results/environment.txt
      - name: Fetch and verify the frozen real quality sample
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download embedding-capacity-benchmark-inputs --repo wietzesuijker/what-to-id \
            --pattern what-to-id-real-10000-vectors.npz --dir index-work
          echo '41b19d3237198a35b31b1b550eb93c9529c62030b0944f8e725450f3bd73fc99  index-work/what-to-id-real-10000-vectors.npz' | sha256sum --check
      - name: Test a synthetic index at full observation count
        run: |
          /usr/bin/time -v -o index-results/build-resources.txt \
            python -u benchmarks/benchmark_vector_index.py \
              --out index-results/index.json --count 3068186 --dimensions 1024 \
              --queries 512 --append 512 --threads 4 --pq 256 --nprobe 32 --quality-nprobe 64 \
              --vectors index-work/what-to-id-real-10000-vectors.npz \
              --max-seconds 600 --index-out index-work/capacity-${{ github.run_id }}.faiss \
              2> index-results/faiss-diagnostics.txt
          sha256sum index-work/capacity-${{ github.run_id }}.faiss > index-results/index.sha256.txt
      - name: Upload the benchmark index to durable release storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/time -v -o index-results/release-upload-resources.txt \
            gh release upload embedding-capacity-benchmark-inputs \
              index-work/capacity-${{ github.run_id }}.faiss --repo wietzesuijker/what-to-id
      - name: Preserve build measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capacity-index-build-${{ github.run_id }}
          path: index-results/
          retention-days: 30
  restore:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU index dependencies
        run: |
          python -m pip install uv==0.12.23
          uv pip install --system faiss-cpu==1.15.1 numpy==2.4.6
          mkdir -p restore-results
          lscpu > restore-results/cpu.txt
      - name: Download the index from durable release storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p index-work
          /usr/bin/time -v -o restore-results/release-download-resources.txt \
            gh release download embedding-capacity-benchmark-inputs --repo wietzesuijker/what-to-id \
              --pattern capacity-${{ github.run_id }}.faiss --dir index-work
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: capacity-index-build-${{ github.run_id }}
          path: index-results
      - name: Verify and query the restored index on a fresh runner
        run: |
          sha256sum --check index-results/index.sha256.txt
          /usr/bin/time -v -o restore-results/resources.txt python - <<'PY'
          import hashlib
          import json
          import resource
          import time
          from pathlib import Path
          import faiss
          import numpy as np
          faiss.omp_set_num_threads(4)
          path = Path('index-work/capacity-${{ github.run_id }}.faiss')
          started = time.perf_counter()
          index = faiss.read_index(str(path))
          load = time.perf_counter() - started
          assert index.ntotal == 3068186 + 512 - 64 and index.d == 1024
          rng = np.random.default_rng(19)
          queries = rng.standard_normal((512, 1024)).astype('float32')
          queries /= np.linalg.norm(queries, axis=1, keepdims=True)
          started = time.perf_counter()
          _, ids = index.search(queries, 12)
          search = time.perf_counter() - started
          assert (ids >= 64).all()
          result = {
              'synthetic': True, 'transfer_source': 'GitHub release asset, separate fresh runner',
              'rows': index.ntotal, 'dimensions': index.d, 'index_bytes': path.stat().st_size,
              'load_seconds': load, 'search_512_seconds': search,
              'peak_rss_bytes': resource.getrusage(resource.RUSAGE_SELF).ru_maxrss * 1024,
              'sha256': hashlib.file_digest(path.open('rb'), 'sha256').hexdigest(),
              'historical_neighbor_refresh_benchmarked': False,
              'full_population_quality_verified': False,
          }
          Path('restore-results/result.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
      - name: Preserve restore measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capacity-index-restored-${{ github.run_id }}
          path: restore-results/
          retention-days: 30

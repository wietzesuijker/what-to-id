[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "what-to-id"
version = "0.1.0"
description = "Tests whether the order of the iNaturalist identification queue changes what gets identified: randomised lists, exposure manifest, read-back"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Wietze Suijker", email = "17180130+wietzesuijker@users.noreply.github.com" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "scipy>=1.11",
]

[project.scripts]
what-to-id = "what_to_id.cli:main"

[project.optional-dependencies]
# Only the similarity arm's seed picker and separability report require this private pin.
similarity = [
    "labelfirst @ git+https://github.com/traitlab/labelfirst.git@791662c0f0d04698f988640aa58ece1f5cb6be59",
]
embed = ["torch>=2.1", "torchvision>=0.16", "open_clip_torch>=2.24", "pillow>=10.0"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/what_to_id"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network and not labelfirst'"
markers = ["network: hits the live iNaturalist API", "labelfirst: requires the pinned optional LabelFirst integration"]
